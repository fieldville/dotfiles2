"$schema" = 'https://starship.rs/config-schema.json'

# Give git (and other module commands) more headroom than the 500ms default.
# On Windows, git_status right after `git pull` can exceed 500ms while git re-hashes
# files through the git-lfs filter; Starship then kills git and git-lfs spams
# "filter-process initialization failed ... The pipe is being closed" at every prompt.
command_timeout = 2000

# Show the shell name: the same Starship config is shared by bash (WSL / Linux),
# zsh (macOS) and PowerShell, so "bash" / "zsh" / "pwsh" is the quick visual cue to
# tell them apart. The os module is deliberately left off: it added nothing on
# top of the shell name and showed a stray Apple glyph on macOS.
# Each indicator is itself a format string, so the colour can differ per shell
# (the module-level `style` applies to all of them and is left unused).
[shell]
disabled = false
powershell_indicator = "[pwsh](bold blue)"
bash_indicator = "[bash](bold yellow)"
zsh_indicator = "[zsh](bold green)"

# No Nerd Font needed. Starship's defaults draw a few symbols from the Nerd Font /
# Powerline private-use glyphs, which show as a box or "?" in a terminal without such a
# font, and a locked-down machine may not allow installing one. Every such default is
# replaced below, so the prompt looks the same on every machine with the stock fonts.
# Branch symbols are the values of `starship preset plain-text-symbols` (the
# no-nerd-font preset leaves the Powerline branch glyph in); the rest is
# `starship preset no-nerd-font` as is. The os module also uses such glyphs but stays
# disabled (see above). After a Starship upgrade, compare with the output of those two
# presets to pick up symbols added since. jj_bookmark (in that preset since Starship
# 1.27.0) is left out on purpose: an older Starship, which a locked-down machine may
# be stuck on, rejects the section with "Unknown key".
[git_branch]
symbol = "git "

[hg_branch]
symbol = "hg "

[fossil_branch]
symbol = "fossil "

[pijul_channel]
symbol = "pijul "

[nodejs]
symbol = "[⬢](bold green) "

[battery]
full_symbol = "• "
charging_symbol = "⇡ "
discharging_symbol = "⇣ "
unknown_symbol = "❓ "
empty_symbol = "❗ "

[azure]
symbol = "☁️ "

[erlang]
symbol = "ⓔ "

[pulumi]
symbol = "🧊 "
