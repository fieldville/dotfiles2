"$schema" = 'https://starship.rs/config-schema.json'

# Give git (and other module commands) more headroom than the 500ms default.
# On Windows, git_status right after `git pull` can exceed 500ms while git re-hashes
# files through the git-lfs filter; Starship then kills git and git-lfs spams
# "filter-process initialization failed ... The pipe is being closed" at every prompt.
command_timeout = 2000

# Show which environment the prompt is running in: the same Starship config is
# shared by WSL and PowerShell (launched from WSL), so the OS icon and shell name
# are the only quick visual cue to tell them apart.
[os]
disabled = false
style = "bold blue"

[os.symbols]
# Plain text on purpose: work machines may not have a Nerd Font installed,
# and these must never render as tofu.
Windows = "win "
Ubuntu  = "wsl "

[shell]
disabled = false
style = "bold yellow"
powershell_indicator = "pwsh"
bash_indicator = "bash"
zsh_indicator = "zsh"
