"$schema" = 'https://starship.rs/config-schema.json'

# Give git (and other module commands) more headroom than the 500ms default.
# On Windows, git_status right after `git pull` can exceed 500ms while git re-hashes
# files through the git-lfs filter; Starship then kills git and git-lfs spams
# "filter-process initialization failed ... The pipe is being closed" at every prompt.
command_timeout = 2000

# Show the shell name: the same Starship config is shared by WSL (bash) and
# PowerShell (launched from WSL), so "bash" vs "pwsh" is the quick visual cue to
# tell them apart. The os module is deliberately left off: it added nothing on
# top of the shell name and showed a stray Apple glyph on macOS.
[shell]
disabled = false
style = "bold yellow"
powershell_indicator = "pwsh"
bash_indicator = "bash"
zsh_indicator = "zsh"
